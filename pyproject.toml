[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edwise-landing"
version = "0.1.0"
description = "Standalone interactive lesson landing page generator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "pydantic>=2.6.0",
  "click>=8.1.0",
  "rich>=13.7.0",
]

[project.scripts]
edwise-landing = "edwise_landing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edwise_landing = ["prompts/*.txt", "assets/*.css", "assets/*.js", "templates/*"]